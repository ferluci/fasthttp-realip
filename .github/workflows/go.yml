on: [push, pull_request]
name: test and build
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Run linters
      uses: golangci/golangci-lint-action@v9
      with:
        # v2 is built with a current Go and reads stable Go export data;
        # v1.64.8 could not ("export data version 5"). Linters: .golangci.yml.
        version: v2.15.0

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [oldstable, stable]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run tests
      run: go test -v -race -covermode=atomic ./...
    - name: Fuzz resolver
      run: go test -run '^$' -fuzz FuzzResolver -fuzztime 30s .

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Build
      # A library has no binary; building all packages is the check.
      run: go build ./...
